name: Weekly Model Retrain

on:
  schedule:
    # Every Saturday at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      skip_tuning:
        description: 'Skip hyperparameter tuning (faster)'
        type: boolean
        default: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger retrain pipeline on Render
        run: |
          SKIP_TUNING="${{ github.event.inputs.skip_tuning }}"
          if [ "$SKIP_TUNING" = "true" ]; then
            BODY='{"skip_tuning": true}'
          else
            BODY='{"skip_tuning": false}'
          fi
          curl -X POST "${{ secrets.RENDER_API_URL }}/api/run/retrain-pipeline" \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            --fail --max-time 120
