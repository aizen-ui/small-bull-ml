name: Nightly Pipeline

on:
  schedule:
    # 6:00 PM UTC = 11:30 PM IST (Mon-Fri)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger nightly pipeline on Render
        run: |
          curl -X POST "${{ secrets.RENDER_API_URL }}/api/run/nightly-pipeline" \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            --fail --max-time 120
