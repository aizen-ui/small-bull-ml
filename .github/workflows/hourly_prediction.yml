name: Minute Predictions (every 5 min via Actions)

on:
  schedule:
    # Every 5 minutes during IST trading hours (3:45 AM - 10:00 AM UTC)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Trigger minute pipeline on Render
        run: |
          curl -X POST "${{ secrets.RENDER_API_URL }}/api/run/minute-pipeline" \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            --fail --max-time 120
