services:
  - type: web
    name: ml-stock-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python api_server.py
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: INDIANAPI_KEY
        sync: false
